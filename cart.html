<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - BookNest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">
    <div id="navbar-placeholder"></div>

    <main class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-6">Giỏ hàng của bạn</h1>
        <div id="cart-items-container" class="mb-8">
            <!-- Cart items will be rendered here -->
        </div>

        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4">Tổng cộng</h2>
            <div class="flex justify-between mb-2">
                <span>Tạm tính</span>
                <span id="cart-subtotal">0đ</span>
            </div>
            <div class="flex justify-between mb-2">
                <span>Phí vận chuyển</span>
                <span>25.000đ</span>
            </div>
            <div class="flex justify-between font-bold text-lg">
                <span>Tổng cộng</span>
                <span id="cart-total">25.000đ</span>
            </div>
            <a href="checkout.html" class="block text-center w-full bg-primary text-white py-3 rounded-lg mt-6 hover:bg-primary/90 transition-colors">
                Tiến hành thanh toán
            </a>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>
    <div id="modal-placeholder"></div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/cart-page.js"></script>
</body>
</html>
