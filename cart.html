<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - BookNest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">
    <div id="navbar-placeholder"></div>

    <main class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-6">Giỏ hàng của bạn</h1>
        <div id="cart-items-container" class="mb-8">
            <!-- Cart items will be rendered here -->
        </div>

        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4">Tổng cộng</h2>
            <div class="flex justify-between mb-2">
                <span>Tạm tính</span>
                <span id="cart-subtotal">0đ</span>
            </div>
            <div class="flex justify-between mb-2">
                <span>Phí vận chuyển</span>
                <span>25.000đ</span>
            </div>
            <div class="flex justify-between font-bold text-lg">
                <span>Tổng cộng</span>
                <span id="cart-total">25.000đ</span>
            </div>
            <a href="checkout.html" class="block text-center w-full bg-primary text-white py-3 rounded-lg mt-6 hover:bg-primary/90 transition-colors">
                Tiến hành thanh toán
            </a>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <div id="modal-placeholder"></div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/cart.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            renderCartPage();
        });

        function renderCartPage() {
            const cartItemsContainer = document.getElementById("cart-items-container");
            const cart = getCart();

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = "<p>Giỏ hàng của bạn đang trống.</p>";
                updateCartSummary(0);
                return;
            }

            cartItemsContainer.innerHTML = cart.map(item => {
                const book = books.find(b => b.id === item.id);
                return `
                    <div class="flex items-center border-b py-4">
                        <img src="${book.image}" alt="${book.name}" class="w-20 h-auto rounded-md mr-4">
                        <div class="flex-grow">
                            <h3 class="font-bold">${book.name}</h3>
                            <p class="text-sm text-gray-500">${book.author}</p>
                            <div class="flex items-center mt-2">
                                <button class="px-2 py-1 border rounded-md" onclick="updateQuantity(${book.id}, ${item.quantity - 1})">-</button>
                                <span class="mx-2">${item.quantity}</span>
                                <button class="px-2 py-1 border rounded-md" onclick="updateQuantity(${book.id}, ${item.quantity + 1})">+</button>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold">${(book.price * item.quantity).toLocaleString('vi-VN')}đ</p>
                            <button class="text-red-500 text-sm mt-2" onclick="removeFromCart(${book.id}); renderCartPage();">Xóa</button>
                        </div>
                    </div>
                `;
            }).join("");

            const subtotal = cart.reduce((sum, item) => {
                const book = books.find(b => b.id === item.id);
                return sum + (book.price * item.quantity);
            }, 0);
            updateCartSummary(subtotal);
        }

        function updateQuantity(bookId, quantity) {
            if (quantity <= 0) {
                removeFromCart(bookId);
            } else {
                const cart = getCart();
                const item = cart.find(i => i.id === bookId);
                if (item) {
                    item.quantity = quantity;
                    saveCart(cart);
                }
            }
            renderCartPage();
        }

        function updateCartSummary(subtotal) {
            const shipping = 25000;
            const total = subtotal + shipping;
            document.getElementById("cart-subtotal").textContent = subtotal.toLocaleString('vi-VN') + 'đ';
            document.getElementById("cart-total").textContent = total.toLocaleString('vi-VN') + 'đ';
        }

    </script>
</body>
</html>
