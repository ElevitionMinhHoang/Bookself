<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - BookNest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">
    <div id="navbar-placeholder"></div>

    <main class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-6">Thông tin thanh toán</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
                <h2 class="text-2xl font-bold mb-4">Địa chỉ giao hàng</h2>
                <form id="checkout-form">
                    <div class="grid grid-cols-1 gap-4">
                        <input type="text" placeholder="Họ và tên" class="w-full p-3 border rounded-lg" required>
                        <input type="email" placeholder="Email" class="w-full p-3 border rounded-lg" required>
                        <input type="tel" placeholder="Số điện thoại" class="w-full p-3 border rounded-lg" required>
                        <input type="text" placeholder="Địa chỉ" class="w-full p-3 border rounded-lg" required>
                        <textarea placeholder="Ghi chú (tùy chọn)" class="w-full p-3 border rounded-lg"></textarea>
                    </div>
                </form>
            </div>
            <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold mb-4">Đơn hàng của bạn</h2>
                <div id="order-summary-container">
                    <!-- Order summary will be rendered here -->
                </div>
                <div class="flex justify-between font-bold text-lg mt-4">
                    <span>Tổng cộng</span>
                    <span id="order-total">0đ</span>
                </div>
                <button id="place-order-btn" class="w-full bg-primary text-white py-3 rounded-lg mt-6 hover:bg-primary/90 transition-colors">
                    Đặt hàng
                </button>
            </div>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>
    <div id="modal-placeholder"></div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/checkout-page.js"></script>
</body>
</html>
