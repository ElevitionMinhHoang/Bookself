<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - BookNest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">
    <div id="navbar-placeholder"></div>

    <main class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-6">Thông tin thanh toán</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
                <h2 class="text-2xl font-bold mb-4">Địa chỉ giao hàng</h2>
                <form id="checkout-form">
                    <div class="grid grid-cols-1 gap-4">
                        <input type="text" placeholder="Họ và tên" class="w-full p-3 border rounded-lg" required>
                        <input type="email" placeholder="Email" class="w-full p-3 border rounded-lg" required>
                        <input type="tel" placeholder="Số điện thoại" class="w-full p-3 border rounded-lg" required>
                        <input type="text" placeholder="Địa chỉ" class="w-full p-3 border rounded-lg" required>
                        <textarea placeholder="Ghi chú (tùy chọn)" class="w-full p-3 border rounded-lg"></textarea>
                    </div>
                </form>
            </div>
            <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold mb-4">Đơn hàng của bạn</h2>
                <div id="order-summary-container">
                    <!-- Order summary will be rendered here -->
                </div>
                <div class="flex justify-between font-bold text-lg mt-4">
                    <span>Tổng cộng</span>
                    <span id="order-total">0đ</span>
                </div>
                <button id="place-order-btn" class="w-full bg-primary text-white py-3 rounded-lg mt-6 hover:bg-primary/90 transition-colors">
                    Đặt hàng
                </button>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <div id="modal-placeholder"></div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/cart.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            renderOrderSummary();

            document.getElementById("place-order-btn").addEventListener("click", function() {
                const form = document.getElementById("checkout-form");
                if (form.checkValidity()) {
                    // Simulate order placement
                    clearCart();
                    showModal("Đặt hàng thành công! Cảm ơn bạn đã mua sắm.", "success");
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 3000);
                } else {
                    form.reportValidity();
                }
            });
        });

        function renderOrderSummary() {
            const orderSummaryContainer = document.getElementById("order-summary-container");
            const cart = getCart();

            if (cart.length === 0) {
                orderSummaryContainer.innerHTML = "<p>Không có sản phẩm nào trong giỏ hàng.</p>";
                updateOrderTotal(0);
                // Disable button if cart is empty
                document.getElementById("place-order-btn").disabled = true;
                document.getElementById("place-order-btn").classList.add("opacity-50", "cursor-not-allowed");
                return;
            }

            orderSummaryContainer.innerHTML = cart.map(item => {
                const book = books.find(b => b.id === item.id);
                return `
                    <div class="flex justify-between items-center border-b py-2">
                        <div>
                            <p>${book.name} <span class="text-sm text-gray-500">x ${item.quantity}</span></p>
                        </div>
                        <p>${(book.price * item.quantity).toLocaleString('vi-VN')}đ</p>
                    </div>
                `;
            }).join("");

            const subtotal = cart.reduce((sum, item) => {
                const book = books.find(b => b.id === item.id);
                return sum + (book.price * item.quantity);
            }, 0);
            updateOrderTotal(subtotal);
        }

        function updateOrderTotal(subtotal) {
            const shipping = 25000;
            const total = subtotal + shipping;
            const orderTotalEl = document.getElementById("order-total");
            if(orderTotalEl) {
                orderTotalEl.textContent = total.toLocaleString('vi-VN') + 'đ';
            }
        }
    </script>
</body>
</html>
