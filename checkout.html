<!DOCTYPE html>
<html class="light" lang="vi">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Thanh Toán - BookNest</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">
    <div class="relative flex min-h-screen w-full flex-col">
        <!-- TopNavBar -->
        <header class="flex w-full items-center justify-center border-b border-solid border-border-light bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm sticky top-0 z-20">
            <div class="flex w-full max-w-7xl items-center justify-between whitespace-nowrap px-4 sm:px-6 lg:px-8 py-3">
                <div class="flex items-center gap-3">
                    <a href="index.html" class="flex items-center gap-3 text-primary">
                        <div class="text-primary size-7">
                            <svg fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M20 5.33333V18.6667C20 19.403 19.403 20 18.6667 20H6.66667C6.29822 20 6 19.7018 6 19.3333C6 18.9649 6.29822 18.6667 6.66667 18.6667H18.6667V5.33333C18.6667 4.96488 18.9649 4.66667 19.3333 4.66667C19.7018 4.66667 20 4.96488 20 5.33333ZM17.3333 3.33333V16C17.3333 16.7364 16.7364 17.3333 16 17.3333H5.33333C4.59695 17.3333 4 16.7364 4 16V4C4 3.44772 4.44772 3 5 3H16.6667C17.0351 3 17.3333 3.29822 17.3333 3.33333ZM16 4.66667H5.33333V16H16V4.66667Z"></path>
                            </svg>
                        </div>
                        <h2 class="text-xl font-bold tracking-tight text-text-light dark:text-text-dark">BookNest</h2>
                    </a>
                </div>
                <div class="flex flex-1 justify-end">
                    <a class="text-sm font-medium text-text-light dark:text-text-dark hover:text-primary dark:hover:text-accent" href="products.html">Quay lại giỏ hàng</a>
                </div>
            </div>
        </header>
        <main class="flex w-full flex-1 justify-center py-8 sm:py-12 lg:py-16">
            <div class="w-full max-w-7xl px-4 sm:px-6 lg:px-8">
                <!-- PageHeading & Breadcrumbs -->
                <div class="mb-8">
                    <div class="flex flex-wrap items-baseline justify-between gap-4">
                        <p class="text-4xl font-black tracking-tighter text-text-light dark:text-text-dark">Thanh Toán</p>
                    </div>
                    <div class="mt-2 flex flex-wrap items-center gap-2">
                        <a class="text-sm font-medium text-primary dark:text-accent" href="#">Giỏ hàng</a>
                        <span class="text-sm text-gray-400">/</span>
                        <span class="text-sm font-medium text-text-light dark:text-text-dark">Địa chỉ &amp; Thanh toán</span>
                        <span class="text-sm text-gray-400">/</span>
                        <span class="text-sm font-medium text-gray-500">Hoàn tất</span>
                    </div>
                </div>
                <div class="grid grid-cols-1 gap-8 lg:grid-cols-3 lg:gap-12">
                    <!-- Left Column -->
                    <div class="flex flex-col gap-8 lg:col-span-2">
                        <!-- Shipping Address Form -->
                        <div class="flex flex-col gap-4">
                            <h2 class="text-xl font-bold">Địa chỉ Giao hàng</h2>
                            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                                <div class="sm:col-span-2">
                                    <label class="block text-sm font-medium mb-1.5" for="full-name">Họ và Tên</label>
                                    <input class="w-full rounded-md border-border-light bg-white dark:bg-gray-800/50 shadow-sm focus:border-primary focus:ring-primary dark:focus:border-accent dark:focus:ring-accent" id="full-name" placeholder="Nguyễn Văn An" type="text" />
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1.5" for="phone">Số điện thoại</label>
                                    <input class="w-full rounded-md border-border-light bg-white dark:bg-gray-800/50 shadow-sm focus:border-primary focus:ring-primary dark:focus:border-accent dark:focus:ring-accent" id="phone" placeholder="09xxxxxxxx" type="tel" />
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1.5" for="email">Email</label>
                                    <input class="w-full rounded-md border-border-light bg-white dark:bg-gray-800/50 shadow-sm focus:border-primary focus:ring-primary dark:focus:border-accent dark:focus:ring-accent" id="email" placeholder="you@example.com" type="email" />
                                </div>
                                <div class="sm:col-span-2">
                                    <label class="block text-sm font-medium mb-1.5" for="address">Địa chỉ</label>
                                    <input class="w-full rounded-md border-border-light bg-white dark:bg-gray-800/50 shadow-sm focus:border-primary focus:ring-primary dark:focus:border-accent dark:focus:ring-accent" id="address" placeholder="Số nhà, tên đường, phường/xã" type="text" />
                                </div>
                                <div class="sm:col-span-2">
                                    <label class="block text-sm font-medium mb-1.5" for="city">Tỉnh / Thành phố</label>
                                    <input class="w-full rounded-md border-border-light bg-white dark:bg-gray-800/50 shadow-sm focus:border-primary focus:ring-primary dark:focus:border-accent dark:focus:ring-accent" id="city" placeholder="Hà Nội" type="text" />
                                </div>
                            </div>
                        </div>
                        <!-- Payment Method -->
                        <div class="flex flex-col gap-4">
                            <h2 class="text-xl font-bold">Phương thức Thanh toán</h2>
                            <div class="grid grid-cols-1 gap-4">
                                <label class="flex cursor-pointer items-center gap-4 rounded-lg border border-border-light p-4 has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary dark:has-[:checked]:border-accent dark:has-[:checked]:ring-accent bg-white dark:bg-gray-800/50 shadow-sm" for="cod">
                                    <input checked="" class="text-primary focus:ring-primary dark:text-accent dark:focus:ring-accent" id="cod" name="payment-method" type="radio" />
                                    <div class="flex flex-col">
                                        <p class="font-medium">Thanh toán khi nhận hàng (COD)</p>
                                        <p class="text-sm text-gray-500">Trả tiền mặt khi shipper giao hàng.</p>
                                    </div>
                                </label>
                                <label class="flex cursor-pointer items-center gap-4 rounded-lg border border-border-light p-4 has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary dark:has-[:checked]:border-accent dark:has-[:checked]:ring-accent bg-white dark:bg-gray-800/50 shadow-sm" for="momo">
                                    <input class="text-primary focus:ring-primary dark:text-accent dark:focus:ring-accent" id="momo" name="payment-method" type="radio" />
                                    <div class="flex flex-col">
                                        <p class="font-medium">Thanh toán bằng ví MoMo</p>
                                        <p class="text-sm text-gray-500">Thanh toán an toàn qua cổng MoMo.</p>
                                    </div>
                                </label>
                                <label class="flex cursor-pointer items-center gap-4 rounded-lg border border-border-light p-4 has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary dark:has-[:checked]:border-accent dark:has-[:checked]:ring-accent bg-white dark:bg-gray-800/50 shadow-sm" for="card">
                                    <input class="text-primary focus:ring-primary dark:text-accent dark:focus:ring-accent" id="card" name="payment-method" type="radio" />
                                    <div class="flex flex-col">
                                        <p class="font-medium">Thẻ tín dụng / Ghi nợ</p>
                                        <p class="text-sm text-gray-500">Chấp nhận Visa, Mastercard, JCB.</p>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>
                    <!-- Right Column / Order Summary Sidebar -->
                    <div class="lg:col-span-1">
                        <div class="sticky top-24 rounded-lg border border-border-light bg-white dark:bg-gray-800/50 p-6 shadow-sm">
                            <h2 class="text-xl font-bold mb-4">Đơn hàng của bạn</h2>
                            <!-- Item List -->
                            <div id="cart-items-container" class="flex flex-col gap-4 mb-6 border-b border-border-light pb-6">
                                <!-- Cart items will be injected here -->
                            </div>
                            <!-- Cost Summary -->
                            <div class="flex flex-col gap-2 mb-6">
                                <div class="flex justify-between">
                                    <p class="text-sm text-gray-600 dark:text-gray-300">Tạm tính</p>
                                    <p id="subtotal" class="text-sm font-medium">0đ</p>
                                </div>
                                <div class="flex justify-between">
                                    <p class="text-sm text-gray-600 dark:text-gray-300">Phí vận chuyển</p>
                                    <p class="text-sm font-medium">25.000đ</p>
                                </div>
                                <div class="flex justify-between mt-2 border-t border-border-light pt-2">
                                    <p class="text-base font-bold">Tổng cộng</p>
                                    <p id="total" class="text-lg font-bold text-primary dark:text-accent">25.000đ</p>
                                </div>
                            </div>
                            <!-- CTA Button -->
                            <button id="place-order-btn" class="flex w-full items-center justify-center gap-2 rounded-lg bg-primary py-3 text-base font-bold text-white hover:bg-opacity-90">
                                <span class="material-symbols-outlined">lock</span>
                                Đặt Hàng
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
