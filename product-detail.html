<!DOCTYPE html>
<html class="light" lang="vi">
<head>

                                </div>
                                <input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border-none bg-primary/10 dark:bg-white/10 h-full placeholder:text-text-muted-light dark:placeholder:text-text-muted-dark px-4 rounded-l-none border-l-0 pl-2 text-sm font-normal leading-normal" placeholder="Tìm kiếm sách..." value="" />

                        </button>

        <main id="product-detail-container" class="container mx-auto px-4 py-8 sm:py-12">
