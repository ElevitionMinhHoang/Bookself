<!DOCTYPE html>
<html class="light" lang="vi">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Tài khoản của bạn - BookNest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-display bg-background text-text-dark">
    <div class="relative flex h-auto min-h-screen w-full flex-col">

        <!-- Navbar Placeholder -->
        <div id="navbar-placeholder"></div>

        <!-- Main Content -->
        <main class="container mx-auto flex-1 px-4 sm:px-6 lg:px-8 py-8 md:py-12">
            <!-- PageHeading -->
            <div class="mb-8">
                <h1 class="text-text-dark text-4xl font-black leading-tight tracking-[-0.033em]">Tài khoản của bạn</h1>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-12 gap-8 lg:gap-12">
                <!-- SideNavBar -->
                <aside class="md:col-span-4 lg:col-span-3">
                    <div class="flex flex-col gap-2 bg-white rounded-xl border border-border-light p-4 sticky top-24">
                        <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-primary/10 text-primary transition-colors" href="#personal-info">
                            <span class="material-symbols-outlined">person</span>
                            <p class="text-sm font-medium leading-normal">Thông tin cá nhân</p>
                        </a>
                        <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-text-dark hover:bg-primary/10 hover:text-primary transition-colors" href="#order-history">
                            <span class="material-symbols-outlined">receipt_long</span>
                            <p class="text-sm font-medium leading-normal">Lịch sử đơn hàng</p>
                        </a>
                        <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-text-dark hover:bg-primary/10 hover:text-primary transition-colors" href="#saved-books">
                            <span class="material-symbols-outlined">bookmark</span>
                            <p class="text-sm font-medium leading-normal">Sách đã lưu</p>
                        </a>
                        <div class="border-t border-border-light my-2"></div>
                        <a id="logout-btn" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-text-dark hover:bg-primary/10 hover:text-primary transition-colors" href="#">
                            <span class="material-symbols-outlined">logout</span>
                            <p class="text-sm font-medium leading-normal">Đăng xuất</p>
                        </a>
                    </div>
                </aside>
                <!-- Content Area -->
                <div class="md:col-span-8 lg:col-span-9 flex flex-col gap-12">
                    <!-- Section 1: Personal Information -->
                    <section id="personal-info">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-primary text-2xl font-bold leading-tight tracking-[-0.015em]">Thông tin cá nhân</h2>
                        </div>
                        <div class="bg-white rounded-xl border border-border-light p-6">
                            <div id="user-info-container" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                <!-- User info will be injected here -->
                            </div>
                        </div>
                    </section>
                    <!-- Section 2: Order History -->
                    <section id="order-history">
                        <h2 class="text-primary text-2xl font-bold leading-tight tracking-[-0.015em] mb-4">Lịch sử đơn hàng</h2>
                        <div class="flex flex-col gap-4">
                           <p class="text-gray-500">Chưa có đơn hàng nào.</p>
                        </div>
                    </section>
                    <!-- Section 3: Saved Books -->
                    <section id="saved-books">
                        <h2 class="text-primary text-2xl font-bold leading-tight tracking-[-0.015em] mb-4">Sách đã lưu</h2>
                        <div id="wishlist-items" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            <!-- Wishlist items will be injected here -->
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <!-- Footer Placeholder -->
        <footer id="footer-placeholder"></footer>
    </div>

    <!-- Modal Placeholder -->
    <div id="modal-placeholder"></div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/account.js"></script>
</body>
</html>
