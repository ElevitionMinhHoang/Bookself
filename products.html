<!DOCTYPE html>
<html class="light" lang="vi">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>BookNest - Khám Phá Sách</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">
    <div class="relative flex min-h-screen w-full flex-col">
        <!-- TopNavBar -->
        <header class="sticky top-0 z-10 w-full bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm border-b border-border-light dark:border-border-dark">
            <div class="container mx-auto px-4">
                <div class="flex h-16 items-center justify-between">
                    <div class="flex items-center gap-4">
                        <a href="index.html" class="flex items-center gap-3 text-primary">
                            <span class="material-symbols-outlined text-3xl">import_contacts</span>
                            <h2 class="text-xl font-bold">BookNest</h2>
                        </a>
                    </div>
                    <nav class="hidden md:flex items-center gap-8">
                        <a class="text-sm font-medium hover:text-primary dark:hover:text-primary transition-colors" href="index.html">Trang chủ</a>
                        <a class="text-sm font-medium text-primary dark:text-primary" href="products.html">Sản phẩm</a>
                        <a class="text-sm font-medium hover:text-primary dark:hover:text-primary transition-colors" href="about.html">Giới thiệu</a>
                        <a class="text-sm font-medium hover:text-primary dark:hover:text-primary transition-colors" href="contact.html">Liên hệ</a>
                    </nav>
                    <div class="flex items-center gap-2">
                        <button class="flex h-10 w-10 cursor-pointer items-center justify-center overflow-hidden rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
                            <span class="material-symbols-outlined text-2xl">favorite</span>
                        </button>
                        <button class="flex h-10 w-10 cursor-pointer items-center justify-center overflow-hidden rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
                            <span class="material-symbols-outlined text-2xl">shopping_cart</span>
                        </button>
                        <a href="login.html" class="flex h-10 w-10 cursor-pointer items-center justify-center overflow-hidden rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
                            <span class="material-symbols-outlined text-2xl">account_circle</span>
                        </a>
                    </div>
                </div>
            </div>
        </header>
        <main class="container mx-auto px-4 py-8 md:py-12">
            <!-- PageHeading -->
            <div class="flex flex-wrap justify-between gap-4 mb-8">
                <div class="flex min-w-72 flex-col gap-2">
                    <h1 class="text-4xl font-black tracking-tight">Khám Phá Sách</h1>
                    <p class="text-base font-normal text-text-subtle-light dark:text-text-subtle-dark">Tìm kiếm và lựa chọn những cuốn sách bạn yêu thích từ hàng ngàn đầu sách khác nhau.</p>
                </div>
            </div>
            <!-- SearchBar -->
            <div class="mb-6">
                <label class="flex flex-col min-w-40 h-14 w-full">
                    <div class="flex w-full flex-1 items-stretch rounded-lg h-full border border-border-light dark:border-border-dark focus-within:ring-2 focus-within:ring-primary">
                        <div class="flex items-center justify-center pl-4">
                            <span class="material-symbols-outlined text-2xl text-text-subtle-light dark:text-text-subtle-dark">search</span>
                        </div>
                        <input id="search-input" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border-none bg-transparent focus:outline-none focus:ring-0 h-full placeholder:text-text-subtle-light dark:placeholder:text-text-subtle-dark px-4 pl-2 text-base font-normal" placeholder="Tìm theo tên sách, tác giả..." value="" />
                    </div>
                </label>
            </div>
            <!-- Chips -->
            <div class="flex flex-wrap gap-3 mb-8">
                <button class="category-btn flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-primary px-4 text-sm font-medium text-white" data-category="all">Tất cả</button>
                <button class="category-btn flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-card-light dark:bg-card-dark border border-border-light dark:border-border-dark px-4 hover:border-primary/50 dark:hover:border-primary/50 transition-colors" data-category="featured">
                    <p class="text-sm font-medium">Tiểu thuyết</p>
                </button>
                <button class="category-btn flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-card-light dark:bg-card-dark border border-border-light dark:border-border-dark px-4 hover:border-primary/50 dark:hover:border-primary/50 transition-colors" data-category="promo">
                    <p class="text-sm font-medium">Kinh tế</p>
                </button>
            </div>
            <!-- ImageGrid -->
            <div id="books-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                <!-- Book cards will be injected here by JavaScript -->
            </div>
            <!-- Pagination -->
            <nav aria-label="Pagination" class="flex items-center justify-center gap-4 mt-12">
                <button class="flex items-center justify-center h-10 w-10 rounded-full text-text-subtle-light dark:text-text-subtle-dark hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
                    <span class="material-symbols-outlined">chevron_left</span>
                </button>
                <a aria-current="page" class="flex h-10 w-10 items-center justify-center rounded-full bg-primary text-sm font-medium text-white" href="#">1</a>
                <a class="flex h-10 w-10 items-center justify-center rounded-full text-sm font-medium hover:bg-black/5 dark:hover:bg-white/10 transition-colors" href="#">2</a>
                <a class="flex h-10 w-10 items-center justify-center rounded-full text-sm font-medium hover:bg-black/5 dark:hover:bg-white/10 transition-colors" href="#">3</a>
                <span class="text-sm font-medium">...</span>
                <a class="flex h-10 w-10 items-center justify-center rounded-full text-sm font-medium hover:bg-black/5 dark:hover:bg-white/10 transition-colors" href="#">8</a>
                <button class="flex items-center justify-center h-10 w-10 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
                    <span class="material-symbols-outlined">chevron_right</span>
                </button>
            </nav>
        </main>
    </div>
    <script src="js/data.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
