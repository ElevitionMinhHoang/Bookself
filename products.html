<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>BookNest - Khám Phá Sách</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">
    <div class="relative flex min-h-screen w-full flex-col">
        <!-- Navbar Placeholder -->
        <div id="navbar-placeholder"></div>

        <main class="container mx-auto px-4 py-8 md:py-12">
            <!-- PageHeading -->
            <div class="flex flex-wrap justify-between gap-4 mb-8">
                <div class="flex min-w-72 flex-col gap-2">
                    <h1 class="text-4xl font-black tracking-tight">Khám Phá Sách</h1>
                    <p class="text-base font-normal text-text-subtle-light dark:text-text-subtle-dark">Tìm kiếm và lựa chọn những cuốn sách bạn yêu thích từ hàng ngàn đầu sách khác nhau.</p>
                </div>
            </div>
            <!-- SearchBar -->
            <div class="mb-6">
                <label class="flex flex-col min-w-40 h-14 w-full">
                    <div class="flex w-full flex-1 items-stretch rounded-lg h-full border border-border-light dark:border-border-dark focus-within:ring-2 focus-within:ring-primary">
                        <div class="flex items-center justify-center pl-4">
                            <span class="material-symbols-outlined text-2xl text-text-subtle-light dark:text-text-subtle-dark">search</span>
                        </div>
                        <input id="product-search-input" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border-none bg-transparent focus:outline-none focus:ring-0 h-full placeholder:text-text-subtle-light dark:placeholder:text-text-subtle-dark px-4 pl-2 text-base font-normal" placeholder="Tìm theo tên sách, tác giả..." value="" />
                    </div>
                </label>
            </div>
            <!-- Chips -->
            <div id="category-chips-container" class="flex flex-wrap gap-3 mb-8">
                <!-- Category chips will be injected here by JavaScript -->
            </div>
            <!-- ImageGrid -->
            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                <!-- Product cards will be injected here by JavaScript -->
            </div>
            <!-- Pagination -->
            <nav id="pagination-container" aria-label="Pagination" class="flex items-center justify-center gap-4 mt-12">
                <!-- Pagination links will be injected here by JavaScript -->
            </nav>
        </main>

        <!-- Footer Placeholder -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- Modal Placeholder -->
    <div id="modal-placeholder"></div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
     <script src="js/wishlist.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
