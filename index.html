<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>BookNest - Sách mở ra thế giới mới</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">
    <div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col">
            <!-- Navbar Placeholder -->
            <div id="navbar-placeholder"></div>

            <main class="flex flex-col items-center w-full">
                <div class="flex flex-col w-full max-w-7xl px-4 sm:px-6 lg:px-8 py-5">
                    <!-- HeroSection -->
                    <div class="w-full">
                        <div class="flex min-h-[480px] flex-col gap-6 bg-cover bg-center bg-no-repeat rounded-xl items-center justify-center p-4" style='background-image: linear-gradient(rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.5) 100%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuDcVEtsaGgGwmcmSlQWVIIxOxK2NG-RouR_IBQx05GjjNjN11wNI0kXa2qNYGhjXAHLVhv6ShyHPKWEcosiv_ByXCyvuJBMczy64arJwHaPgu6KBm5UZYfBxUu3joEE7gkTwdmoa6atvbJZbcCplN4QxrnAP0SNHAlseIwjHanz0W_ULnyCC00b1_lJvowNsCRVVw817eb01lmzwwwtmw9JdZU3BDlGiR3Mz0a9cRXhchMIiXOGoeuBdmhAwLxHc2bXQKVVoQLQtkOr");'>
                            <div class="flex flex-col gap-4 text-center">
                                <h1 class="text-white text-4xl font-black leading-tight tracking-[-0.033em] sm:text-5xl lg:text-6xl">Sách mở ra thế giới mới.</h1>
                                <h2 class="text-white/90 text-base font-normal leading-normal sm:text-lg">Khám phá hàng ngàn đầu sách hấp dẫn tại BookNest.</h2>
                            </div>
                            <a href="products.html" class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-accent text-primary text-base font-bold leading-normal tracking-[0.015em] hover:bg-accent/90 transition-colors">
                                <span class="truncate">Khám phá ngay</span>
                            </a>
                        </div>
                    </div>
                    <!-- Featured Books Section -->
                    <section class="w-full mt-10">
                        <h2 class="text-2xl sm:text-3xl font-bold leading-tight tracking-[-0.015em] px-4 pb-4">Sách nổi bật</h2>
                        <div id="featured-books-container" class="flex overflow-x-auto [-ms-scrollbar-style:none] [scrollbar-width:none] [&amp;::-webkit-scrollbar]:hidden -mx-4">
                            <!-- Books will be injected here by JavaScript -->
                        </div>
                    </section>
                    <!-- Featured Categories Section -->
                    <section class="w-full mt-10">
                        <h2 class="text-2xl sm:text-3xl font-bold leading-tight tracking-[-0.015em] px-4 pb-4">Thể loại nổi bật</h2>
                        <div id="categories-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 px-4">
                            <!-- Categories will be injected here by JavaScript -->
                        </div>
                    </section>
                    <!-- Promotions / Bestsellers Section -->
                    <section class="w-full mt-10">
                        <h2 class="text-2xl sm:text-3xl font-bold leading-tight tracking-[-0.015em] px-4 pb-4">Khuyến mãi / Sách bán chạy</h2>
                        <div id="promo-books-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 px-4">
                           <!-- Promo books will be injected here by JavaScript -->
                        </div>
                    </section>
                </div>
            </main>
            <!-- Footer -->
             <div id="footer-placeholder"></div>
        </div>
    </div>

    <!-- Modal Placeholder -->
    <div id="modal-placeholder"></div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
